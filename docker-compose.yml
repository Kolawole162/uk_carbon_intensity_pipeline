services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"   # 5433 on your laptop, so it doesn't clash with your local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro   # creates the tables automatically
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres   # inside Docker, containers find each other by service name
      DB_PORT: "5432"
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: